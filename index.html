<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אימון Full Body</title><style>body{font-family:system-ui,Arial;background:#f4f6fa;color:#172033;margin:0;padding:18px}main{max-width:700px;margin:auto}h1{margin-bottom:5px}.muted{color:#64748b}.card{background:white;border-radius:16px;padding:16px;margin:13px 0;box-shadow:0 2px 12px #17203312}.art{height:125px;background:#e9f1fc;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:10px}button{border:0;border-radius:10px;padding:12px 16px;background:#1e40af;color:white;font-weight:700;font-size:16px;cursor:pointer;margin:3px}button.secondary{background:#e2e8f0;color:#172033}.sets{display:flex;gap:6px;flex-wrap:wrap}.sets button{background:#dbeafe;color:#1e40af}.sets button.done{background:#15803d;color:white}.timer{position:sticky;top:0;background:#172033;color:white;border-radius:14px;padding:14px;z-index:3;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px}.timer button{background:#fff;color:#172033}#clock{font-size:27px;font-weight:800}small{color:#64748b}</style></head><body><main><h1>💪 אימון Full Body</h1><p class="muted">10 תרגילים · 55–65 דקות · מנוחה 60–90 שניות</p><section class="timer"><div>⏱️ טיימר מנוחה <span id="clock">01:00</span></div><div><button onclick="startTimer(60)">60 שנ׳</button><button onclick="startTimer(90)">90 שנ׳</button><button onclick="stopTimer()">עצור</button></div></section><div id="exercises"><div class="card">טוען תרגילים...</div></div><button class="secondary" onclick="resetAll()">אפס אימון</button><p><small>הנתונים נשמרים במכשיר ובדפדפן שבו פתחת את האתר. האיורים הם סמלים להמחשה.</small></p></main><script>
const data=[['פשיטת ברכיים','ירך קדמית',3,'12','🦵'],['סקוואט לספסל','רגליים וישבן',3,'10','🏋️'],['דדליפט רומני עם משקולות','ירך אחורית וישבן',2,'10','🏋️'],['לחיצת חזה עם משקולות','חזה',3,'10–12','💪'],['פולי עליון','גב',3,'10–12','🏋️'],['לחיצת כתפיים עם משקולות','כתפיים',2,'10','💪'],['חתירה עם משקולת על ספסל','גב אמצעי',2,'12 לכל צד','🏋️'],['כפיפת מרפקים עם משקולות','יד קדמית',2,'12','💪'],['פשיטת מרפקים עם משקולת','יד אחורית',2,'12','💪'],['Bird Dog','בטן וליבה',2,'8 לכל צד','🧘']];
let state={};try{state=JSON.parse(localStorage.getItem('gym-progress-v1')||'{}')}catch(e){}function save(){try{localStorage.setItem('gym-progress-v1',JSON.stringify(state))}catch(e){}}function toggle(i,j){state[i]??={};state[i][j]=!state[i][j];save();render()}function resetAll(){if(confirm('לאפס את כל הסימונים?')){state={};save();render()}}function render(){document.getElementById('exercises').innerHTML=data.map((d,i)=>`<article class="card"><div class="art" aria-hidden="true">${d[4]}</div><h2>${i+1}. ${d[0]}</h2><p class="muted">${d[1]} · ${d[2]} סטים × ${d[3]} חזרות</p><div class="sets">${Array.from({length:d[2]},(_,j)=>`<button class="${state[i]?.[j]?'done':''}" onclick="toggle(${i},${j})">סט ${j+1} ${state[i]?.[j]?'✓':'○'}</button>`).join('')}</div></article>`).join('')};render();let deadline=0,interval=null,remaining=60;function update(){let t=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):remaining;document.getElementById('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(deadline&&t===0){clearInterval(interval);interval=null;deadline=0;remaining=0}}function startTimer(s){clearInterval(interval);remaining=s;deadline=Date.now()+s*1000;update();interval=setInterval(update,250)}function stopTimer(){if(deadline)remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));deadline=0;clearInterval(interval);interval=null;update()}update();
</script></body></html>
